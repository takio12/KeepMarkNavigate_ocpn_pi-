name: Build KeepMarkNavigate OpenCPN Test DLL

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configure CMake
        shell: pwsh
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        shell: pwsh
        run: |
          cmake --build build

      - name: Collect artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path output
          Get-ChildItem -Recurse build
          Copy-Item build\KeepMarkNavigate_ocpn_pi.dll output\KeepMarkNavigate_ocpn_pi.dll

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: keepmark-ocpn-test-dll
          path: output/
